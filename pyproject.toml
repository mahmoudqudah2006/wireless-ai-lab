[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-ai-lab"
version = "0.1.0"
description = "Machine-learning experiments for wireless link quality and modulation selection."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mahmoud Alqudah"}]
dependencies = ["numpy>=2,<3", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
plot = ["matplotlib>=3.9,<4"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
wireless-ai = "wireless_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
